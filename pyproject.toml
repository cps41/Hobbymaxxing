[project]
name = "hobbymaxxing"
version = "0.1.0"
description = "Agentic orchestrator that decides what hobby to do and when"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hobbymaxxing"]
